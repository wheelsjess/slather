<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Fighter Competition Terms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Press+Start+2P&display=swap">
<style>
  :root { --bg: #fff8e6; --card: #fffdf6; --ink: #16120f; --dim: #6b5a45; --line: #ead9b4; --accent: #e2361f; --sun: #ffe800; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16120f; --card: #201a15; --ink: #f6eedd; --dim: #bba98a; --line: #3a3026; --accent: #ff6a4a; --sun: #ffe800; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { background: #16120f; color: #fffdf2; padding: 28px 16px 24px; text-align: center; border-bottom: 6px solid var(--sun); }
  header .brand { font-family: Anton, Impact, sans-serif; font-size: 44px; letter-spacing: .01em; line-height: 1; color: var(--sun); margin: 0; }
  header .game { font-family: 'Press Start 2P', monospace; font-size: 12px; color: #ff8a1f; margin: 10px 0 0; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 56px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; }
  .meta { color: var(--dim); margin: 0 0 28px; }
  h2 { font-size: 18px; margin: 28px 0 8px; }
  p, li { margin: 0 0 10px; }
  ol, ul { padding-left: 22px; }
  a { color: var(--accent); }
  .soon { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .back { display: inline-block; margin-top: 32px; font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--ink); text-decoration: none; background: var(--sun); padding: 12px 16px; border: 2px solid #16120f; box-shadow: 3px 3px 0 #16120f; }
</style>
</head>
<body>
<header>
  <p class="brand">SLATHER</p>
  <p class="game">SUN FIGHTER</p>
</header>
<main>
  <h1>Sun Fighter competition terms and conditions</h1>
  <p class="meta">Free tube of Slather SPF 50+ for the 50 fastest times</p>

  <!-- TERMS START: replace this block with the final terms -->
  <div class="soon">
    <p><strong>The full terms are coming soon.</strong></p>
    <p>They'll be published here before the competition opens.</p>
  </div>
  <!-- TERMS END -->

  <a class="back" href="/">BACK TO THE GAME</a>
</main>
</body>
</html>
