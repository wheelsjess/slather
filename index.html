<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Slather Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Knewave&family=Permanent+Marker&family=Press+Start+2P&display=swap">
<style>
/* Layout: one 480x270 pixel canvas scaled up and centred; touch controls float over the letterbox. Single deliberate look. */
:root{
  --sun:#FFE800;     /* Slather tube yellow */
  --ink:#16120f;     /* outline black */
  --paper:#fffdf2;
  --veil:rgba(22,18,15,.55);
  --pix:'Press Start 2P', 'Courier New', monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.ui{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px;z-index:3}
.ui button{font-family:var(--pix);font-size:9px;line-height:1;color:var(--paper);background:var(--veil);border:2px solid var(--paper);padding:6px 8px;cursor:pointer}
.ui button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#touch{position:absolute;inset:0;pointer-events:none;z-index:2}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:75%;pointer-events:auto}
#stickBase{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(255,253,242,.55);background:rgba(0,0,0,.18)}
#stickKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,232,0,.85);border:3px solid var(--ink)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid var(--ink);font-family:var(--pix);color:var(--ink);
  background:rgba(255,253,242,.88);display:grid;place-items:center;padding:0;line-height:1.2}
.tb.on{background:var(--sun)}
#tShoot{width:96px;height:96px;font-size:11px;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);background:rgba(255,232,0,.92)}
#rotate{display:none;position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center;font-family:var(--pix);font-size:11px;line-height:1.6;color:var(--sun)}
@media (orientation:portrait){body.touch #rotate{display:block}}
/* Loading screen, Skyrim-style: real text over the canvas so the serif stays crisp. --u is one game pixel. */
#loadScreen{position:absolute;z-index:1;pointer-events:none;overflow:hidden;color:#e6dfd2;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:500;font-variant-numeric:lining-nums;--u:2px}
#loadScreen .art{position:absolute;left:3%;bottom:0;height:100%;transform-origin:45% 85%;animation:lsZoom 16s ease-out forwards}
#loadScreen .art img{height:100%;display:block;image-rendering:pixelated;-webkit-mask-image:linear-gradient(to right,#000 70%,transparent 98%);mask-image:linear-gradient(to right,#000 70%,transparent 98%)}
@keyframes lsZoom{from{transform:scale(1)}to{transform:scale(1.08)}}
#loadScreen .fog{position:absolute;left:-30%;width:160%;height:34%;bottom:-8%;border-radius:50%;background:radial-gradient(ellipse at 50% 60%,rgba(120,108,96,.28),rgba(0,0,0,0) 62%);animation:lsFog 22s ease-in-out infinite alternate}
#loadScreen .fog.b{bottom:-14%;height:28%;opacity:.8;animation-duration:30s;animation-direction:alternate-reverse}
@keyframes lsFog{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
#loadScreen .how{position:absolute;right:4%;top:15%;width:50%;text-align:right;font-size:calc(var(--u)*7.2);line-height:1.85;letter-spacing:.03em}
#loadScreen .how h2{margin:0 0 .35em;font-size:1.25em;font-weight:600;letter-spacing:.18em;color:#f3ead8}
#loadScreen .how .k{color:#a89f90}
#loadScreen .how .gap{height:.6em}
#loadScreen .how .it{display:inline-flex;gap:.25em;align-items:flex-end;margin-right:.45em;vertical-align:-.55em}
#loadScreen .how .it img{height:1.9em;width:auto;image-rendering:pixelated;filter:drop-shadow(0 0 2px rgba(255,236,190,.55))}
#loadScreen .tip{position:absolute;right:4%;bottom:12%;width:46%;text-align:right;font-size:calc(var(--u)*8.6);line-height:1.32;letter-spacing:.02em}
#loadScreen .tip.fade{animation:lsTip 1s ease-out}
@keyframes lsTip{from{opacity:0}to{opacity:1}}
#loadScreen .tip b{font-weight:600;letter-spacing:.12em;color:#f3ead8}
#loadScreen .bar{position:absolute;left:34%;right:34%;bottom:2.5%;height:calc(var(--u)*.6);background:rgba(230,223,210,.14)}
#loadScreen .bar i{display:block;height:100%;width:0;background:#e6dfd2;box-shadow:0 0 6px rgba(255,240,200,.6)}
#loadScreen .go{position:absolute;right:4%;bottom:4%;text-align:right;font-size:calc(var(--u)*7);letter-spacing:.24em;opacity:0}
#loadScreen .go.on{animation:lsGo 1.6s ease-in-out infinite}
@keyframes lsGo{0%,100%{opacity:.35}50%{opacity:1}}
/* Elden Ring-style banners: a dark band across the middle and big Roman capitals. --u is one game pixel. */
#erBanner{position:absolute;z-index:1;pointer-events:none;display:flex;align-items:center;justify-content:center;--u:2px}
#erBanner .band{position:absolute;left:0;right:0;top:52%;height:40%;transform:translateY(-50%);opacity:0;
  background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.78) 26%,rgba(0,0,0,.78) 74%,rgba(0,0,0,0))}
#erBanner .words{position:relative;font-family:Cinzel,'Trajan Pro','Times New Roman',serif;font-weight:500;white-space:nowrap;opacity:0;text-align:center}
#erBanner .ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:Cinzel,'Times New Roman',serif;white-space:nowrap;opacity:0;filter:blur(1px)}
#erBanner .sub{position:absolute;left:0;right:0;top:60%;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:calc(var(--u)*8.5);line-height:1.5;letter-spacing:.18em;color:#ece3d4;text-shadow:0 0 4px #000,0 0 2px #000;opacity:0}
#erBanner.died .band{animation:erFade 1.8s ease-out forwards}
#erBanner.died .words{color:#a8160f;font-size:calc(var(--u)*30);letter-spacing:.06em;text-shadow:0 0 calc(var(--u)*4) rgba(120,0,0,.45);animation:erFade 2.4s ease-out .35s forwards,erGrow 7s ease-out .35s forwards}
#erBanner.died .sub{animation:erFade 1.2s ease-out 2.4s forwards}
#erBanner.died .sub .again{animation:erPulse 1.8s ease-in-out 3.6s infinite}
#erBanner.felled .band{animation:erFade 1s ease-out forwards}
#erBanner.felled .words{color:#e8c25a;font-size:calc(var(--u)*24);letter-spacing:.03em;text-shadow:0 0 calc(var(--u)*3) rgba(255,210,120,.35);animation:erFade 1.2s ease-out .2s forwards}
#erBanner.felled .ghost{color:#c8a050;font-size:calc(var(--u)*24);letter-spacing:.03em;animation:erGhost 3.2s ease-out .2s forwards}
@keyframes erFade{from{opacity:0}to{opacity:1}}
@keyframes erGrow{from{transform:scale(.97)}to{transform:scale(1.06)}}
@keyframes erGhost{0%{opacity:0;transform:translate(-50%,-50%) scale(1)}25%{opacity:.5}100%{opacity:0;transform:translate(-50%,-50%) scale(1.28)}}
@keyframes erPulse{0%,100%{opacity:.4}50%{opacity:1}}
/* Souls-style boss name over the health bar: off-white serif, left-aligned, with a soft shadow */
#bossName{position:absolute;z-index:1;pointer-events:none;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:600;color:#ece6da;
  letter-spacing:.05em;white-space:nowrap;text-shadow:0 0 3px #000,0 1px 2px #000,0 0 8px rgba(0,0,0,.8);transition:opacity .9s ease}
#bossName.out{opacity:0;transition:opacity .35s ease}
#bossName.flash{animation:bnFlash 1.6s ease-out}
@keyframes bnFlash{0%{color:#fff3c0;text-shadow:0 0 10px #ffb02a,0 0 3px #000}100%{color:#ece6da}}
#tRoll{width:70px;height:70px;font-size:10px;right:calc(env(safe-area-inset-right,0px) + 128px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="480" height="270" aria-label="Slather Ring game screen"></canvas>
  <div class="ui"><button id="muteBtn" type="button">SOUND ON</button><button id="pauseBtn" type="button">PAUSE</button></div>
  <div id="loadScreen" hidden aria-live="polite">
    <div class="art"><img id="lsImg" alt="The bogan, battle-ready with two tubes of Slather"></div>
    <div class="fog"></div><div class="fog b"></div>
    <div class="how" id="lsHow"></div>
    <div class="tip" id="lsTip"></div>
    <div class="go" id="lsGo">PRESS ENTER TO SLATHER UP</div>
    <div class="bar"><i id="lsBar"></i></div>
  </div>
  <div id="erBanner" hidden aria-live="assertive"><div class="band"></div><div class="ghost"></div><div class="words"></div><div class="sub"></div></div>
  <div id="bossName" hidden></div>
  <p id="rotate">TURN YOUR PHONE SIDEWAYS<br>FOR A BIGGER BEACH</p>
  <div id="touch" hidden>
    <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
    <button class="tb" id="tRoll" type="button">ROLL</button>
    <button class="tb" id="tShoot" type="button">SQUIRT</button>
  </div>
</div>
<script>
(() => {
'use strict';
/* ================= Setup ================= */
const W = 480, H = 270;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Tuning ---------------------------------------------------------------
const FLOOR = { x0: 18, x1: 462, y0: 166, y1: 244 };   // where the bogan can walk
const HORIZON = 104, SHORE = 152;
const BOSS_MAX = 3300;
const PLAYER_HP = 100;
const UV_RATE = [0, 2.4, 3.6, 5.2];   // sunburn build-up per second with no SPF
const GAP = [0, 1.2, 0.88, 0.64];     // rest between boss attacks per phase
const SPF_TIME = 8;          // UV shield: hits bounce off and hurt the Sun
const DUAL_TIME = 10;
const KILL_HEAL = 55;         // the Sun heals for every beachgoer it torches
const PLAYER_TAKES = 0.7;      // damage multipliers: lower both to make the fight last longer at the same difficulty
const SUN_TAKES = 0.62;
const HAT_TIME = 20;
const DMG = { slam: 22, sweep: 18, laser: 15, orb: 14, ray: 16, grab: 24, grabLaser: 45, wave: 13, flare: 36, burn: 14, fire: 8 };
const HIT_INVULN = 0.8;
const HEAL = { potato: 20, dimsim: 14 };
// Set to true once real PNGs are in ./assets (see ASSETS.md). Missing files fall back to the built-in art.
const USE_ASSET_FILES = false;

const C = {
  ink: '#16120f', sun: '#fbdd01', sunD: '#e29207', sunL: '#fff27a', white: '#fffdf2', red: '#e2361f',

};
const PIX = '"Press Start 2P", "Courier New", monospace';

   Every sprite is a horizontal strip of equal-size frames. The built-in art below is a stand-in;

function sheet(name, fw, fh, n, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = fw * n; c.height = fh;
  const g = c.getContext('2d');
  for (let i = 0; i < n; i++) { g.save(); g.translate(i * fw, 0); g.beginPath(); g.rect(0, 0, fw, fh); g.clip(); draw(g, i, fw, fh); g.restore(); }

  SPR[name] = { img: c, fw, fh, n };

}
function tinted(name, color) { // solid-colour silhouette of a sprite, for hit flashes and glows
  const s = SPR[name], c = document.createElement('canvas'); c.width = s.img.width; c.height = s.img.height;
  const g = c.getContext('2d'); g.drawImage(s.img, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);

}
function spr(s, f, x, y, o = {}) {
  if (typeof s === 'string') s = SPR[s];
  const ax = o.ax ?? 0.5, ay = o.ay ?? 1, fr = Math.max(0, Math.floor(f)) % s.n;
  const dx = Math.round(x - s.fw * ax), dy = Math.round(y - s.fh * ay);
  if (o.alpha != null) ctx.globalAlpha = o.alpha;

}

const line = (g, pts, lw = 2) => { g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = C.ink; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.stroke(); };

const runF = (i, shoot) => { const s = Math.sin(i / 6 * TAU); return { bob: i % 3 === 1 ? 1 : 0, lA: Math.max(0, Math.round(2 * s)), lB: Math.max(0, Math.round(-2 * s)), armL: Math.round(2 * s), armR: Math.round(-2 * s), shoot }; };

for (let i = 0; i < 5; i++) BOGAN_FRAMES.push({ mode: 'roll', f: i });
for (let i = 0; i < 6; i++) BOGAN_FRAMES.push(runF(i, true));

for (let i = 0; i < 6; i++) BOGAN_FRAMES.push({ ...runF(i, true), dual: true });

function useBoganArt(name, url) {
  const im = new Image();
  im.onload = () => {
    const old = SPR[name], c = document.createElement('canvas'); c.width = 32 * 28; c.height = 56; const g = c.getContext('2d');

    for (const f of [20]) g.drawImage(old.img, f * 32, 0, 32, 48, f * 32, 8, 32, 48);
    SPR[name] = { img: c, fw: 32, fh: 56, n: 28 }; if (typeof buildTints === 'function') buildTints();
  };
  im.src = url;
}
function useArt(name, fw, fh, url) { // swap a drawn stand-in for the brand art once it decodes

}

/* ================= Leaderboard ================= */
// Fastest kills. In claude.ai the board is shared: each signed-in player keeps their own best runs at scores/<their id>
// and everyone reads the whole collection. Anywhere else (or if the viewer can't write) it falls back to this browser only.
const fmtT = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}.${String(Math.floor((t % 1) * 100)).padStart(2, '0')}`;
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const BOARD = { list: [], shared: false, mine: [], db: null, uid: null, saving: false, lastAt: 0 };
const cleanRun = r => r && typeof r.t === 'number' && r.t > 5 && r.t < 36000 && typeof r.i === 'string'
  ? { i: (r.i.toUpperCase().replace(/[^A-Z]/g, '') + 'AAA').slice(0, 3), t: r.t, at: typeof r.at === 'number' ? r.at : 0 } : null;
const sortRuns = a => a.filter(Boolean).sort((x, y) => x.t - y.t);
function localRuns() { try { return sortRuns((JSON.parse(localStorage.getItem('slather-board') || '[]')).map(cleanRun)); } catch (_) { return []; } }
function useLocal() { BOARD.shared = false; BOARD.db = null; BOARD.list = localRuns(); }
useLocal();
(async () => {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    BOARD.db = db; BOARD.uid = uid;
    db.collection('scores').onSnapshot(snap => {
      const all = [];
      for (const d of snap.docs) {
        const runs = (d.data()?.runs || []).map(cleanRun).filter(Boolean);
        if (d.id === uid) BOARD.mine = sortRuns(runs.slice());
        all.push(...runs);
      }
      if (BOARD.db) { BOARD.shared = true; BOARD.list = sortRuns(all); }
    }, () => useLocal());
  } catch (_) { useLocal(); }
})();
async function saveRun(run) {
  try { const l = localRuns(); l.push(run); localStorage.setItem('slather-board', JSON.stringify(sortRuns(l).slice(0, 20))); } catch (_) {}
  if (BOARD.db) {
    const runs = sortRuns([...BOARD.mine, run]).slice(0, 10);
    BOARD.list = sortRuns([...BOARD.list, run]);   // show it straight away; the snapshot confirms it
    BOARD.saving = true;
    try { await BOARD.db.doc('scores/' + BOARD.uid).set({ runs }); BOARD.mine = runs; }
    catch (_) { useLocal(); }   // e.g. a view-only visitor: keep it on this device instead
    BOARD.saving = false;
  } else BOARD.list = localRuns();
}
function startInitials() { S.mode = 'initials'; S.modeT = 0; S.ini = { l: (S.lastIni || 'AAA').split('').map(c => LETTERS.indexOf(c)), c: 0 }; SFX.ding(); }
function spinLetter(i, d) { const L = S.ini.l; L[i] = (L[i] + d + LETTERS.length) % LETTERS.length; S.ini.c = i; SFX.ding(); }
function submitInitials() {
  const i = S.ini.l.map(n => LETTERS[n]).join('');
  S.lastIni = i; BOARD.lastAt = Date.now();
  saveRun({ i, t: Math.round(S.fight * 100) / 100, at: BOARD.lastAt });
  S.mode = 'board'; S.modeT = 0; SFX.win();
}
function initialsKey(e) {
  const k = e.code, I = S.ini; e.preventDefault();
  if (k === 'ArrowUp') spinLetter(I.c, -1);
  else if (k === 'ArrowDown') spinLetter(I.c, 1);
  else if (k === 'ArrowLeft' || k === 'Backspace') I.c = Math.max(0, I.c - 1);
  else if (k === 'ArrowRight') I.c = Math.min(2, I.c + 1);
  else if (k === 'Enter' || k === 'Space') { if (e.repeat || S.modeT < 0.3) return; if (I.c < 2) I.c++; else submitInitials(); }
  else if (/^Key[A-Z]$/.test(k) && !e.repeat) { I.l[I.c] = LETTERS.indexOf(k[3]); if (I.c < 2) I.c++; SFX.ding(); }
}
const INI_X = [W / 2 - 44, W / 2, W / 2 + 44];
function initialsTap(e) {

}
