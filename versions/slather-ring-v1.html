<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Slather Ring v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Press+Start+2P&display=swap">
<style>
/* Layout: one 480x270 pixel canvas scaled up and centred; touch controls float over the letterbox. Single deliberate look. */
:root{
  --sun:#FFE800;     /* Slather tube yellow */
  --ink:#16120f;     /* outline black */
  --paper:#fffdf2;
  --veil:rgba(22,18,15,.55);
  --pix:'Press Start 2P', 'Courier New', monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.ui{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px;z-index:3}
.ui button{font-family:var(--pix);font-size:9px;line-height:1;color:var(--paper);background:var(--veil);border:2px solid var(--paper);padding:6px 8px;cursor:pointer}
.ui button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#touch{position:absolute;inset:0;pointer-events:none;z-index:2}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:75%;pointer-events:auto}
#stickBase{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(255,253,242,.55);background:rgba(0,0,0,.18)}
#stickKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,232,0,.85);border:3px solid var(--ink)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid var(--ink);font-family:var(--pix);color:var(--ink);
  background:rgba(255,253,242,.88);display:grid;place-items:center;padding:0;line-height:1.2}
.tb.on{background:var(--sun)}
#tShoot{width:96px;height:96px;font-size:11px;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);background:rgba(255,232,0,.92)}
#rotate{display:none;position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center;font-family:var(--pix);font-size:11px;line-height:1.6;color:var(--sun)}
@media (orientation:portrait){body.touch #rotate{display:block}}
#tRoll{width:70px;height:70px;font-size:10px;right:calc(env(safe-area-inset-right,0px) + 128px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="480" height="270" aria-label="Slather Ring game screen"></canvas>
  <div class="ui"><button id="muteBtn" type="button">SOUND ON</button><button id="pauseBtn" type="button">PAUSE</button></div>
  <p id="rotate">TURN YOUR PHONE SIDEWAYS<br>FOR A BIGGER BEACH</p>
  <div id="touch" hidden>
    <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
    <button class="tb" id="tRoll" type="button">ROLL</button>
    <button class="tb" id="tShoot" type="button">SQUIRT</button>
  </div>
</div>
<script>
(() => {
'use strict';
/* ================= Setup ================= */
const W = 480, H = 270;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Tuning ---------------------------------------------------------------
const FLOOR = { x0: 18, x1: 462, y0: 166, y1: 244 };   // where the bogan can walk
const HORIZON = 104, SHORE = 152;
const BOSS_MAX = 3300;
const PLAYER_HP = 100;
const UV_RATE = [0, 2.4, 3.6, 5.2];   // sunburn build-up per second with no SPF
const GAP = [0, 1.2, 0.88, 0.64];     // rest between boss attacks per phase
const SPF_TIME = 8;          // UV shield: hits bounce off and hurt the Sun
const DUAL_TIME = 10;
const KILL_HEAL = 55;         // the Sun heals for every beachgoer it torches
const PLAYER_TAKES = 0.7;      // damage multipliers: lower both to make the fight last longer at the same difficulty
const SUN_TAKES = 0.62;
const HAT_TIME = 20;
const DMG = { slam: 22, sweep: 18, laser: 15, orb: 14, ray: 16, grab: 24, grabLaser: 45, wave: 13, flare: 36, burn: 14, fire: 8 };
const HIT_INVULN = 0.8;
const HEAL = { potato: 20, dimsim: 14 };
// Set to true once real PNGs are in ./assets (see ASSETS.md). Missing files fall back to the built-in art.
const USE_ASSET_FILES = false;

const C = {
  ink: '#16120f', sun: '#ffcf1a', sunD: '#e3a20c', sunL: '#fff27f', white: '#fffdf2', red: '#e2361f',
  skin: '#f4a98c', skinD: '#d9846a', burnt: '#e5503b', singlet: '#e8ff3a', singletD: '#bdd61f',
  shorts: '#c8a86b', shortsD: '#9e8250', hair: '#a27b4b', hairD: '#76582f', thong: '#2f6fd1', slather: '#ffe800',
};
const PIX = '"Press Start 2P", "Courier New", monospace';

/* ================= Sprite system =================
   Every sprite is a horizontal strip of equal-size frames. The built-in art below is a stand-in;
   with USE_ASSET_FILES on, ./assets/<name>.png replaces it (same frame size and count). */
const SPR = {};
function crisp(c) {
  const g = c.getContext('2d'), d = g.getImageData(0, 0, c.width, c.height), a = d.data;
  for (let i = 3; i < a.length; i += 4) a[i] = a[i] > 110 ? 255 : 0;
  g.putImageData(d, 0, 0);
}
function outline(c) {
  const g = c.getContext('2d'), w = c.width, h = c.height, d = g.getImageData(0, 0, w, h), a = d.data, o = new Uint8ClampedArray(a);
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && a[(y * w + x) * 4 + 3] > 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (a[i + 3] === 0 && (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1))) { o[i] = 22; o[i + 1] = 18; o[i + 2] = 15; o[i + 3] = 255; }
  }
  g.putImageData(new ImageData(o, w, h), 0, 0);
}
function sheet(name, fw, fh, n, draw, opts = {}) {
  const c = document.createElement('canvas'); c.width = fw * n; c.height = fh;
  const g = c.getContext('2d');
  for (let i = 0; i < n; i++) { g.save(); g.translate(i * fw, 0); g.beginPath(); g.rect(0, 0, fw, fh); g.clip(); draw(g, i, fw, fh); g.restore(); }
  crisp(c); if (opts.outline) outline(c);
  SPR[name] = { img: c, fw, fh, n };
  if (USE_ASSET_FILES) { const im = new Image(); im.onload = () => { SPR[name] = { img: im, fw: im.width / n, fh: im.height, n }; buildTints(); }; im.src = 'assets/' + name + '.png'; }
}
function tinted(name, color) { // solid-colour silhouette of a sprite, for hit flashes and glows
  const s = SPR[name], c = document.createElement('canvas'); c.width = s.img.width; c.height = s.img.height;
  const g = c.getContext('2d'); g.drawImage(s.img, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return { img: c, fw: s.fw, fh: s.fh, n: s.n };
}
function spr(s, f, x, y, o = {}) {
  if (typeof s === 'string') s = SPR[s];
  const ax = o.ax ?? 0.5, ay = o.ay ?? 1, fr = Math.max(0, Math.floor(f)) % s.n;
  const dx = Math.round(x - s.fw * ax), dy = Math.round(y - s.fh * ay);
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.flip) { ctx.save(); ctx.translate(dx + s.fw, dy); ctx.scale(-1, 1); ctx.drawImage(s.img, fr * s.fw, 0, s.fw, s.fh, 0, 0, s.fw, s.fh); ctx.restore(); }
  else ctx.drawImage(s.img, fr * s.fw, 0, s.fw, s.fh, dx, dy, s.fw, s.fh);
  ctx.globalAlpha = 1;
}
const RR = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
const ELL = (g, x, y, rx, ry, rot = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); };
function part(g, shape, fill = C.sun) { shape(); g.fillStyle = fill; g.fill(); g.lineWidth = 2; g.strokeStyle = C.ink; g.stroke(); }
const line = (g, pts, lw = 2) => { g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = C.ink; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.stroke(); };
const curve = (g, x0, y0, cx, cy, x1, y1, lw = 2) => { g.lineWidth = lw; g.lineCap = 'round'; g.strokeStyle = C.ink; g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(cx, cy, x1, y1); g.stroke(); };

/* ---------- The Sun ---------- */
sheet('sun_torso', 140, 112, 1, g => {
  const body = () => { g.beginPath(); g.moveTo(58, 2); g.lineTo(82, 2); g.quadraticCurveTo(84, 14, 98, 16); g.quadraticCurveTo(122, 18, 124, 34);
    g.lineTo(112, 62); g.quadraticCurveTo(104, 84, 110, 112); g.lineTo(30, 112); g.quadraticCurveTo(36, 84, 28, 62); g.lineTo(16, 34);
    g.quadraticCurveTo(18, 18, 42, 16); g.quadraticCurveTo(56, 14, 58, 2); g.closePath(); };
  body(); g.fillStyle = C.sun; g.fill();
  g.save(); body(); g.clip(); g.fillStyle = C.sunD; g.beginPath(); g.ellipse(124, 70, 22, 70, 0, 0, TAU); g.fill(); g.restore();
  body(); g.lineWidth = 2; g.strokeStyle = C.ink; g.stroke();
  for (const x of [52, 88]) { ELL(g, x, 46, 3, 3); g.lineWidth = 2; g.stroke(); }
  curve(g, 40, 64, 46, 68, 52, 66); curve(g, 100, 64, 94, 68, 88, 66);
  curve(g, 64, 94, 70, 99, 74, 93); line(g, [70, 86, 70, 89]);
  curve(g, 34, 78, 38, 80, 42, 78); curve(g, 106, 78, 102, 80, 98, 78);
});
sheet('sun_head', 150, 140, 1, g => {
  const cx = 75, cy = 80;
  for (let k = 0; k < 15; k++) {
    const a = -Math.PI + 0.35 + k * (Math.PI * 2 - 0.7) / 14; // all round except under the chin
    const ang = a - Math.PI / 2;
    const b1 = ang - 0.16, b2 = ang + 0.16, len = k % 2 ? 66 : 72;
    part(g, () => { g.beginPath(); g.moveTo(cx + Math.cos(b1) * 40, cy + Math.sin(b1) * 40); g.lineTo(cx + Math.cos(ang) * len, cy + Math.sin(ang) * len); g.lineTo(cx + Math.cos(b2) * 40, cy + Math.sin(b2) * 40); g.closePath(); });
  }
  ELL(g, cx, cy, 46, 44); g.fillStyle = C.sun; g.fill();
  g.save(); ELL(g, cx, cy, 46, 44); g.clip(); g.fillStyle = C.sunD; ELL(g, cx + 34, cy + 22, 30, 34); g.fill(); g.fillStyle = C.sunL; ELL(g, cx - 22, cy - 26, 12, 7, -0.5); g.fill(); g.restore();
  ELL(g, cx, cy, 46, 44); g.lineWidth = 2; g.strokeStyle = C.ink; g.stroke();
});
function eye(g, cx, cy, w, h, px, lidY, fill = '#fffbe8') {
  const sh = () => { g.beginPath(); g.moveTo(cx - w, cy); g.quadraticCurveTo(cx, cy - h * 2, cx + w, cy); g.quadraticCurveTo(cx, cy + h * 1.5, cx - w, cy); };
  sh(); g.fillStyle = fill; g.fill();
  g.save(); sh(); g.clip(); g.fillStyle = C.ink; g.fillRect(cx + px - 2, cy - 3, 4, 5);
  if (lidY != null) { g.fillStyle = C.sun; g.fillRect(cx - w, cy - h * 2, w * 2, lidY - (cy - h * 2)); }
  g.restore(); sh(); g.lineWidth = 2; g.strokeStyle = C.ink; g.stroke();
  if (lidY != null) line(g, [cx - w + 2, lidY, cx + w - 2, lidY]);
}
const FACE_KINDS = ['smug', 'grin', 'rage', 'hurt', 'dead', 'shock', 'gross'];
sheet('sun_face', 96, 72, 7, (g, i) => {
  const k = FACE_KINDS[i];
  if (k === 'smug') {
    eye(g, 30, 30, 13, 5, 6, 29); eye(g, 66, 30, 13, 5, 6, 29);
    curve(g, 16, 22, 30, 17, 44, 23); curve(g, 52, 23, 66, 17, 80, 22);
    line(g, [48, 26, 46, 46, 52, 47]);
    curve(g, 30, 54, 50, 61, 66, 52); line(g, [66, 52, 70, 48]);
    curve(g, 42, 65, 48, 67, 54, 65);
  } else if (k === 'grin') {
    eye(g, 30, 30, 13, 7, 5, null); eye(g, 66, 30, 13, 7, 5, null);
    line(g, [14, 17, 42, 25], 3); line(g, [54, 25, 82, 17], 3);
    line(g, [48, 26, 46, 42, 51, 43]);
    g.beginPath(); g.moveTo(26, 48); g.quadraticCurveTo(48, 55, 70, 48); g.quadraticCurveTo(48, 74, 26, 48); g.fillStyle = C.ink; g.fill();
    g.fillStyle = C.red; ELL(g, 50, 61, 9, 3); g.fill();
    g.fillStyle = '#fffbe8'; for (let x = 31; x < 64; x += 6) { g.beginPath(); g.moveTo(x, 50); g.lineTo(x + 5, 51); g.lineTo(x + 2.5, 56); g.fill(); }
  } else if (k === 'rage') {
    for (const x of [30, 66]) { g.fillStyle = '#ff8a2a'; ELL(g, x, 30, 12, 9); g.fill(); g.fillStyle = '#ff3a1a'; ELL(g, x, 30, 8, 6); g.fill(); g.fillStyle = '#fff5c0'; ELL(g, x, 30, 3, 3); g.fill(); }
    line(g, [12, 14, 42, 26], 3); line(g, [54, 26, 84, 14], 3);
    line(g, [48, 28, 46, 42, 51, 43]);
    g.fillStyle = C.ink; ELL(g, 48, 56, 17, 12); g.fill();
    g.fillStyle = C.red; ELL(g, 48, 63, 9, 4); g.fill();
    g.fillStyle = '#fffbe8'; for (let x = 36; x < 60; x += 6) { g.beginPath(); g.moveTo(x, 45); g.lineTo(x + 5, 45); g.lineTo(x + 2.5, 50); g.fill(); }
  } else if (k === 'hurt') {
    line(g, [22, 25, 34, 30, 22, 35], 3); line(g, [74, 25, 62, 30, 74, 35], 3);
    line(g, [48, 28, 46, 42, 51, 43]);
    line(g, [34, 56, 39, 53, 44, 57, 49, 53, 54, 57, 59, 53, 62, 56]);
    g.fillStyle = '#9fdcff'; ELL(g, 82, 22, 3, 4); g.fill();
  } else if (k === 'shock') {
    for (const x of [30, 66]) { g.fillStyle = '#fffbe8'; ELL(g, x, 30, 11, 10); g.fill(); g.lineWidth = 2; g.strokeStyle = C.ink; g.stroke(); g.fillStyle = C.ink; g.fillRect(x - 1, 29, 3, 3); }
    curve(g, 16, 12, 30, 6, 42, 14); curve(g, 54, 14, 66, 6, 80, 12);
    line(g, [48, 28, 46, 42, 51, 43]);
    g.fillStyle = C.ink; ELL(g, 48, 56, 7, 9); g.fill();
  } else if (k === 'gross') {
    line(g, [20, 28, 40, 30], 3); eye(g, 66, 30, 12, 7, -3, null);
    line(g, [14, 20, 40, 24], 3); line(g, [56, 18, 80, 22], 2);
    line(g, [48, 28, 46, 42, 51, 43]);
    line(g, [32, 52, 38, 50, 44, 53, 50, 50, 56, 53, 62, 51]);
    g.fillStyle = C.red; g.fillRect(44, 52, 9, 12); g.fillStyle = '#fffdf2'; ELL(g, 48, 58, 4, 3); g.fill(); ELL(g, 40, 50, 3, 2); g.fill();
  } else {
    for (const x of [30, 66]) { line(g, [x - 7, 24, x + 7, 36], 3); line(g, [x + 7, 24, x - 7, 36], 3); }
    line(g, [48, 28, 46, 42, 51, 43]);
    curve(g, 32, 56, 48, 50, 64, 56); g.fillStyle = C.red; g.fillRect(44, 55, 8, 7);
  }
});
const HAND_POSES = ['open', 'fist', 'slam', 'point', 'grab'];
sheet('sun_hand', 64, 64, 5, (g, i) => {
  const p = HAND_POSES[i];
  if (p === 'open') {
    for (const [x, y, w, h] of [[16, 8, 8, 30], [25, 3, 8, 32], [34, 5, 8, 30], [43, 11, 7, 26]]) part(g, () => RR(g, x, y, w, h, 4));
    part(g, () => ELL(g, 11, 42, 6, 12, -0.5));
    part(g, () => RR(g, 14, 26, 38, 34, 12));
    curve(g, 22, 40, 32, 46, 42, 38); curve(g, 24, 50, 34, 52, 44, 48);
  } else if (p === 'fist') {
    part(g, () => RR(g, 10, 18, 44, 40, 14));
    for (let k = 0; k < 4; k++) part(g, () => ELL(g, 17 + k * 10, 22, 6, 6));
    for (let k = 1; k < 4; k++) line(g, [12 + k * 10, 28, 12 + k * 10, 36]);
    part(g, () => RR(g, 12, 38, 30, 10, 5));
  } else if (p === 'slam') {
    part(g, () => ELL(g, 32, 48, 28, 12));
    for (let k = 0; k < 4; k++) part(g, () => ELL(g, 14 + k * 11, 56, 5, 5));
    part(g, () => ELL(g, 58, 44, 6, 4));
    curve(g, 16, 44, 32, 40, 48, 44);
  } else if (p === 'point') {
    part(g, () => RR(g, 26, 2, 10, 32, 5));
    part(g, () => RR(g, 12, 28, 40, 32, 13));
    for (let k = 0; k < 3; k++) part(g, () => ELL(g, 20 + k * 10, 31, 5, 5));
    part(g, () => RR(g, 14, 44, 26, 9, 4));
  } else {
    part(g, () => RR(g, 12, 4, 40, 30, 12));
    for (let k = 0; k < 4; k++) part(g, () => RR(g, 13 + k * 10, 26, 8, k === 0 || k === 3 ? 22 : 27, 4));
    part(g, () => ELL(g, 55, 22, 6, 11, 0.4));
  }
});
sheet('logo', 44, 44, 1, g => {
  g.strokeStyle = C.white; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath();
  for (let i = 0; i < 32; i++) { const r = i % 2 ? 12 : 20, a = i / 32 * TAU - Math.PI / 2; const x = 22 + Math.cos(a) * r, y = 22 + Math.sin(a) * r; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.closePath(); g.stroke(); g.beginPath(); g.arc(22, 22, 8, 0, TAU); g.stroke();
  g.lineWidth = 1.5; g.beginPath(); g.moveTo(18, 20); g.lineTo(20, 19); g.moveTo(24, 19); g.lineTo(26, 20); g.moveTo(22, 20); g.lineTo(22, 24); g.moveTo(18, 25); g.quadraticCurveTo(22, 28, 26, 25); g.stroke();
});

/* ---------- The bogan (back view, facing the Sun) ---------- */
function drawBogan(g, o) {
  const skin = o.skin, skinD = o.skinD;
  const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  if (o.mode === 'roll') {
    const a = o.f / 5 * TAU;
    g.fillStyle = skin; ELL(g, 16, 38, 9, 9); g.fill();
    g.fillStyle = C.singlet; g.beginPath(); g.arc(16, 38, 9, a, a + 2.2); g.lineTo(16, 38); g.fill();
    g.fillStyle = C.shorts; g.beginPath(); g.arc(16, 38, 9, a + 2.2, a + 3.6); g.lineTo(16, 38); g.fill();
    g.fillStyle = C.hair; ELL(g, 16 + Math.cos(a - 1) * 6, 38 + Math.sin(a - 1) * 6, 4, 4); g.fill();
    return;
  }
  if (o.mode === 'dead') {
    R(skin, 2, 39, 9, 3); R(skin, 2, 43, 9, 3); R(C.thong, 0, 38, 2, 4); R(C.thong, 0, 43, 2, 4);
    R(C.shorts, 10, 37, 7, 10); R(C.singlet, 17, 37, 8, 10); R(skin, 18, 47, 6, 1);
    R(skin, 25, 38, 5, 8); R(C.hair, 27, 37, 4, 10); R(C.hair, 30, 39, 2, 6);
    return;
  }
  const b = o.bob || 0;
  R(skin, 10, 34 - o.lA, 5, 12); R(skin, 17, 34 - o.lB, 5, 12);
  R(skinD, 10, 41 - o.lA, 5, 1); R(skinD, 17, 41 - o.lB, 5, 1);
  R(C.thong, 9, 46 - o.lA, 7, 2); R(C.thong, 16, 46 - o.lB, 7, 2);
  R(C.shorts, 8, 27 + b, 16, 9); R(C.shortsD, 8, 34 + b, 16, 2); R(C.shortsD, 15, 29 + b, 1, 6); R('#6b5a3a', 8, 27 + b, 16, 1);
  R(C.singlet, 9, 14 + b, 14, 13); R(C.singletD, 9, 25 + b, 14, 2);
  R(skin, 7, 15 + b, 3, 4); R(skin, 22, 15 + b, 3, 4);
  if (o.mode === 'hurt') { R(skin, 1, 15 + b, 7, 3); R(skin, 24, 15 + b, 7, 3); R(C.slather, 28, 11 + b, 4, 6); }
  else if (o.mode === 'win') { R(skin, 5, 3, 3, 14); R(skin, 24, 3, 3, 14); R(C.slather, 23, 0, 5, 6); }

/* ================= Music: a little SNES-style sequencer ================= */
const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const nm = s => { const m = /^([A-G])(#?)(\d)$/.exec(s); return m ? 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] ? 1 : 0) : null; };
const seq = str => str.trim().split(/\s+/).map(t => t === '.' ? null : nm(t));

                    D5 . . G4 . . B4 . D5 . G5 . F5 . D5 .   E5 . G#5 . B5 . G#5 . E5 . D5 . C5 . B4 .`);
const LEAD_B = seq(`A5 . E5 A5 . C6 . B5 A5 . G5 . E5 . G5 A5   F5 . C5 F5 . A5 . G5 F5 . E5 . C5 . E5 F5
                    G5 . D5 G5 . B5 . A5 G5 . F5 . D5 . F5 G5   G#5 . E5 G#5 . B5 . D6 E6 . D6 . B5 . G#5 .`);
const LEAD_BEACH = seq(`E5 . . G5 . . C6 . B5 . G5 . E5 . . .   F5 . . A5 . . C6 . A5 . F5 . D5 . . .
                        D5 . . G5 . . B5 . A5 . G5 . F5 . D5 .   E5 . C5 . G4 . C5 . E5 . . . . . . .`);
const MINOR = { roots: ['A2', 'F2', 'G2', 'E2'].map(nm), chords: [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 56, 59]] };
const TRACKS = {
  beach: { bpm: 104, lead: LEAD_BEACH, roots: ['C3', 'F2', 'G2', 'C3'].map(nm), bassPat: [0, null, 7, null, 12, null, 7, null], drums: 'k...h...s...h...', leadVol: 0.045 },
  fight1: { bpm: 126, lead: LEAD_A, ...MINOR, bassPat: [0, null, 12, null], drums: 'k.h.s.h.k.k.s.h.', leadVol: 0.05 },
  fight2: { bpm: 146, lead: LEAD_B, ...MINOR, bassPat: [0, 0, 12, 0], drums: 'k.hhs.hhk.khs.hh', leadVol: 0.05, arp: true },
  fight3: { bpm: 170, lead: LEAD_B, ...MINOR, bassPat: [0, 12, 0, 12], drums: 'khkhskhkkhkhskss', leadVol: 0.05, arp: true, transpose: 1 },

const MUS = { name: null, step: 0, next: 0, bus: null, echo: null, pulse: null };
function musicNodes() {
  if (MUS.bus) return;
  MUS.bus = actx.createGain(); MUS.bus.gain.value = 0.9; MUS.bus.connect(OUT());
  const d = actx.createDelay(), fb = actx.createGain(), wet = actx.createGain(); // SNES-style echo on the lead
  d.delayTime.value = 0.19; fb.gain.value = 0.32; wet.gain.value = 0.35; d.connect(fb).connect(d); d.connect(wet).connect(MUS.bus); MUS.echo = d;
  const n = 32, re = new Float32Array(n), im = new Float32Array(n);
  for (let k = 1; k < n; k++) im[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * 0.25); // 25% pulse wave
  MUS.pulse = actx.createPeriodicWave(re, im);
}
function mnote(m, t, dur, vol, type, echo) {
  const o = actx.createOscillator(), g = actx.createGain();

}
function playStep(T, i, t, sp) {
  const tr = T.transpose || 0, bar = Math.floor(i / 16), st = i % 16, dl = Math.max(0, t - actx.currentTime);
  if (T.lead[i] != null) mnote(T.lead[i] + tr, t, sp * 1.9, T.leadVol, 'pulse', true);
  const bp = T.bassPat[st % T.bassPat.length]; if (bp != null) mnote(T.roots[bar] + tr + bp, t, sp * 0.9, 0.11, 'triangle');
  if (T.arp) { const ch = T.chords[bar]; mnote(ch[st % 3] + tr + 12, t, sp * 0.55, 0.022, 'square'); }

  if (dr === 'k') tone(150, 42, 0.13, 0.32, 'sine', dl);
  else if (dr === 's') { noise(0.12, 1800, 0.8, 0.12, 'bandpass', dl); tone(230, 120, 0.07, 0.06, 'triangle', dl); }

/* ================= Leaderboard ================= */

useLocal();
(async () => {
  try {
    if (!window.claude || !claude.use) return;

    const uid = user ? await user.id() : null;
    if (!db || !uid) return;

      const all = [];
      for (const d of snap.docs) {
        const runs = (d.data()?.runs || []).map(cleanRun).filter(Boolean);
        if (d.id === uid) BOARD.mine = sortRuns(runs.slice());
        all.push(...runs);

})();
async function saveRun(run) {
  try { const l = localRuns(); l.push(run); localStorage.setItem('slather-board', JSON.stringify(sortRuns(l).slice(0, 20))); } catch (_) {}
  if (BOARD.db) {
    const runs = sortRuns([...BOARD.mine, run]).slice(0, 10);
    BOARD.list = sortRuns([...BOARD.list, run]);   // show it straight away; the snapshot confirms it
    BOARD.saving = true;
    try { await BOARD.db.doc('scores/' + BOARD.uid).set({ runs }); BOARD.mine = runs; }
    catch (_) { useLocal(); }   // e.g. a view-only visitor: keep it on this device instead

function startInitials() { S.mode = 'initials'; S.modeT = 0; S.ini = { l: (S.lastIni || 'AAA').split('').map(c => LETTERS.indexOf(c)), c: 0 }; SFX.ding(); }

function initialsKey(e) {

const INI_X = [W / 2 - 44, W / 2, W / 2 + 44];
function initialsTap(e) {

  if (S.modeT < 0.3) return;

/* ================= Loop ================= */

    } else updateBoss(dt);

    if (S.sunSay && (S.sunSay.life -= dt) <= 0) S.sunSay = null;

    updateParts(dt);
    S.shake = Math.max(0, S.shake - dt * 14); S.whiteA = Math.max(0, S.whiteA - dt * 1.4); S.hurtA = Math.max(0, S.hurtA - dt * 3);

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;

  if (S.blueA > 0) { ctx.fillStyle = `rgba(191,234,255,${S.blueA * (Math.floor(S.time * 16) % 2 ? 1 : 0.5)})`; ctx.fillRect(0, 0, W, H); }
  if (S.goldA > 0) { ctx.fillStyle = `rgba(255,232,0,${S.goldA * (Math.floor(S.time * 16) % 2 ? 0.5 : 0.25)})`; ctx.fillRect(0, 0, W, H); }

function fit() {
