    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,120*S,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  if(G.mode==='play'){
    const p=player, q=p.state==='rag'?p.pts[PELV]:p;

function drawLights(){

function drawBar(){

const PX=new Float64Array(11), PY=new Float64Array(11);
function seg(a,b,w,col){ ctx.strokeStyle=col; ctx.lineWidth=w*S; ctx.beginPath(); ctx.moveTo(PX[a],PY[a]); ctx.lineTo(PX[b],PY[b]); ctx.stroke(); }
function dot(i,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(PX[i],PY[i],r*S,0,Math.PI*2); ctx.fill(); }
function hornsAt(i,col){
  // index and pinky up: \m/
  ctx.strokeStyle=col; ctx.lineWidth=1.7*S; ctx.beginPath();
  ctx.moveTo(PX[i]-1.5*S,PY[i]-1*S); ctx.lineTo(PX[i]-3*S,PY[i]-7*S);
  ctx.moveTo(PX[i]+1.5*S,PY[i]-1*S); ctx.lineTo(PX[i]+3*S,PY[i]-7*S); ctx.stroke();
}

function drawOutline(c,col,extra){
  const P=c.pts;
  for(let i=0;i<11;i++){ PX[i]=sx(P[i].x); PY[i]=sy(P[i].y,P[i].z); }
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineCap='round'; ctx.lineJoin='round';
  const poly3=(a,b,c2,w)=>{ ctx.lineWidth=w*S; ctx.beginPath(); ctx.moveTo(PX[a],PY[a]); ctx.lineTo(PX[b],PY[b]); ctx.lineTo(PX[c2],PY[c2]); ctx.stroke(); };
  poly3(PELV,LKNE,LFT,6.3+extra); poly3(PELV,RKNE,RFT,6.3+extra);
  poly3(NECK,LELB,LHND,4.6+extra); poly3(NECK,RELB,RHND,4.6+extra);
  ctx.lineWidth=(13+extra)*S; ctx.beginPath(); ctx.moveTo(PX[NECK],PY[NECK]); ctx.lineTo(PX[PELV],PY[PELV]); ctx.stroke();
  ctx.beginPath(); ctx.arc(PX[HEAD],PY[HEAD],(7+extra/2)*S,0,Math.PI*2); ctx.fill();
}
function drawChar(c){
  const P=c.pts, L=c.look;
  if(c===player && G.mode==='play') drawOutline(c,'#ffd23f',4);
  for(let i=0;i<11;i++){ PX[i]=sx(P[i].x); PY[i]=sy(P[i].y,P[i].z); }
  const facingCam = c.state!=='rag' && Math.sin(c.fa)>.15;
  const order=[
    [0,(P[LKNE].y+P[LFT].y)/2], [1,(P[RKNE].y+P[RFT].y)/2],
    [2,(P[LELB].y+P[LHND].y)/2], [3,(P[RELB].y+P[RHND].y)/2],
    [4,(P[NECK].y+P[PELV].y)/2], [5,P[HEAD].y+.01]
  ];
  order.sort((a,b)=>a[1]-b[1]);
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(c.inst==='guitar'||c.inst==='bass') drawGuitar(c, true);
  for(const [k] of order){
    switch(k){
      case 0: case 1: {
        const kn=k?RKNE:LKNE, ft=k?RFT:LFT;
        ctx.strokeStyle=L.pants; ctx.lineWidth=6.3*S; ctx.beginPath(); ctx.moveTo(PX[PELV],PY[PELV]); ctx.lineTo(PX[kn],PY[kn]); ctx.lineTo(PX[ft],PY[ft]); ctx.stroke();
        break;
      }
      case 2: case 3: {
        const el=k===3?RELB:LELB, hd=k===3?RHND:LHND;
        ctx.strokeStyle=L.skin; ctx.lineWidth=4.6*S; ctx.beginPath(); ctx.moveTo(PX[NECK],PY[NECK]); ctx.lineTo(PX[el],PY[el]); ctx.lineTo(PX[hd],PY[hd]); ctx.stroke();
        ctx.strokeStyle=L.shirt; ctx.lineWidth=6.2*S; ctx.beginPath(); ctx.moveTo(PX[NECK],PY[NECK]);
        if(L.longSleeve) ctx.lineTo(PX[el],PY[el]); else ctx.lineTo(PX[NECK]+(PX[el]-PX[NECK])*.45,PY[NECK]+(PY[el]-PY[NECK])*.45);
        ctx.stroke();
        if(k===2 ? c.hL : c.hR) hornsAt(hd,L.skin);
        if(k===3 && c.cup && c.state!=='rag'){ ctx.fillStyle='rgba(232,184,74,.95)'; ctx.fillRect(PX[RHND]-2.5*S,PY[RHND]-8*S,5*S,8*S); ctx.fillStyle='#fff'; ctx.fillRect(PX[RHND]-2.5*S,PY[RHND]-8*S,5*S,2*S); }
        if(c.inst==='drums'){ ctx.strokeStyle='#e8d8b0'; ctx.lineWidth=1.6*S; ctx.beginPath(); ctx.moveTo(PX[hd],PY[hd]); ctx.lineTo(PX[hd]+(k===3?5:-5)*S,PY[hd]-9*S); ctx.stroke(); }
        if(c.inst==='mic' && k===3){ ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(PX[RHND],PY[RHND]-3*S,2.6*S,0,Math.PI*2); ctx.fill(); }
        break;
      }
      case 4: {
        seg(NECK,PELV,13,L.shirt);
        const mx=(PX[NECK]*.55+PX[PELV]*.45), my=(PY[NECK]*.55+PY[PELV]*.45);
        if(L.vest){ ctx.fillStyle='#c2182b'; ctx.fillRect(mx-4*S,my-3*S,3*S,3*S); ctx.fillStyle='#e8e4da'; ctx.fillRect(mx+1*S,my,3*S,3*S); }
        else if(c.role==='guard'){ ctx.fillStyle='#111'; ctx.fillRect(mx-4*S,my-1.5*S,8*S,2*S); }
        else { ctx.fillStyle=L.print; ctx.globalAlpha=.85; ctx.fillRect(mx-3*S,my-3*S,6*S,6*S); ctx.globalAlpha=1; }
        break;
      }
      case 5: drawHead(c, facingCam); break;
    }
  }
  if(c.inst==='guitar'||c.inst==='bass') drawGuitar(c, false);
}

function drawHead(c, facingCam){
  const L=c.look, hx=PX[HEAD], hy=PY[HEAD], r=7*S;
  const hairBehind = c.hair && c.hair[1].y < c.pts[HEAD].y;
  if(c.hair && hairBehind) drawHair(c);
  ctx.fillStyle=L.skin; ctx.beginPath(); ctx.arc(hx,hy,r,0,Math.PI*2); ctx.fill();
  const ht=L.hairType, hc=L.hair;
  if(ht!=='bald'){
    ctx.fillStyle = ht==='beanie'?'#2b2b33' : ht==='cap'?L.cap : hc;
    if(!facingCam && c.state!=='rag' && ht!=='mohawk'){ ctx.beginPath(); ctx.arc(hx,hy,r*1.04,0,Math.PI*2); ctx.fill(); }
    else if(ht==='buzz'){ ctx.globalAlpha=.6; ctx.beginPath(); ctx.arc(hx,hy,r,Math.PI*1.05,Math.PI*1.95); ctx.fill(); ctx.globalAlpha=1; }
    else if(ht!=='mohawk'){ ctx.beginPath(); ctx.arc(hx,hy-.5*S,r*1.06,Math.PI*1.02,Math.PI*1.98); ctx.closePath(); ctx.fill(); }
    if(ht==='mohawk'){
      ctx.fillStyle=L.mohawk;
      const ux=PX[HEAD]-PX[NECK], uy=PY[HEAD]-PY[NECK], ul=Math.hypot(ux,uy)||1, nx=ux/ul, ny=uy/ul;
      ctx.beginPath(); ctx.moveTo(hx-ny*3*S+nx*4*S, hy+nx*3*S+ny*4*S);
      ctx.lineTo(hx+nx*17*S, hy+ny*17*S); ctx.lineTo(hx+ny*3*S+nx*4*S, hy-nx*3*S+ny*4*S); ctx.closePath(); ctx.fill();
    }
  }
  if(facingCam && c.state!=='surf'){
    const rx=-Math.sin(c.fa)*S, ry=Math.cos(c.fa)*K*S;
    ctx.fillStyle='#120e0c';
    ctx.fillRect(hx+rx*2.6-1*S,hy+ry*2.6+.5*S,1.8*S,1.8*S); ctx.fillRect(hx-rx*2.6-1*S,hy-ry*2.6+.5*S,1.8*S,1.8*S);
    if(c.act==='horns'||c.act==='shove'||c.bit==='scream'||c.bit==='hype'||c.inst==='mic'){ ctx.fillRect(hx-1.5*S,hy+3.6*S,3*S,2.4*S); }
  }
  if(c.hair && !hairBehind) drawHair(c);
}
function drawHair(c){
  ctx.strokeStyle=c.look.hair; ctx.lineWidth=8*S; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(PX[HEAD],PY[HEAD]-2*S);
  for(const q of c.hair) ctx.lineTo(sx(q.x),sy(q.y,q.z));
  ctx.stroke();
}
function drawGuitar(c, behind){
  const P=c.pts, cf=Math.cos(c.fa), sf=Math.sin(c.fa);
  const isBehind = Math.sin(c.fa)<0;
  if(behind!==isBehind || c.state==='rag') return;
  const bw={x:P[PELV].x+cf*9, y:P[PELV].y+sf*9, z:P[PELV].z+4};
  const bx=sx(bw.x), by=sy(bw.y,bw.z);
  let hx, hy;
  if(c.hL){
    // fretting hand is up throwing horns: the neck hangs out to the side
    hx=sx(bw.x+cf*10+sf*20); hy=sy(bw.y+sf*10-cf*20,bw.z+10);
  } else { hx=PX[LHND]+(PX[LHND]-bx)*.35; hy=PY[LHND]+(PY[LHND]-by)*.35; }
  ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=3*S; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(hx,hy); ctx.stroke();
  ctx.fillStyle=c.inst==='bass'?'#e2ddd2':'#c2182b';
  ctx.beginPath(); ctx.ellipse(bx,by,10*S,7*S,Math.atan2(hy-by,hx-bx),0,Math.PI*2); ctx.fill();
}

function drawShadows(){
  ctx.fillStyle='rgba(0,0,0,.34)';
  for(const c of chars){
    const p=c.state==='rag'?c.pts[PELV]:c;
    const fl=floorZ(p.x,p.y), h=Math.max(0,(c.state==='rag'?0:c.z-fl));
    const s=Math.max(.4,1-h/160);
    ctx.beginPath(); ctx.ellipse(sx(p.x),sy(p.y,fl),(c.state==='rag'?20:13)*S*s,6*S*s,0,0,Math.PI*2); ctx.fill();
  }
}

function balanceRect(p){ const x=sx(p.x), y=sy(p.y,p.z+62), w=150*S, h=12*S; return [x-w/2-30*S, y-h/2-44*S, w+60*S, h+80*S]; }
function hits(r,x,y,w,h){ return x<r[0]+r[2] && x+w>r[0] && y<r[1]+r[3] && y+h>r[1]; }
function blocked(x,y,w,h){ for(const r of G.uiRects) if(hits(r,x,y,w,h)) return true; return false; }
function drawBalance(p){
  const x=sx(p.x), y=sy(p.y,p.z+62), w=150*S, h=12*S;
  const secs=p.surfF/60, diff=1+p.surfF/540;
  ctx.save();
  ctx.fillStyle='rgba(10,8,12,.75)'; roundRect(x-w/2-6*S,y-h/2-20*S,w+12*S,h+38*S,6*S); ctx.fill();
  const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
  g.addColorStop(0,'#d4152f'); g.addColorStop(.22,'#ff9f43'); g.addColorStop(.42,'#3fd16b'); g.addColorStop(.58,'#3fd16b'); g.addColorStop(.78,'#ff9f43'); g.addColorStop(1,'#d4152f');
  ctx.fillStyle=g; ctx.fillRect(x-w/2,y-h/2,w,h);
  const nx=x+clamp(p.bal,-1,1)*w/2;
  ctx.fillStyle='#f2ece0'; ctx.fillRect(nx-2*S,y-h/2-4*S,4*S,h+8*S);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${Math.round(10*S)}px ${FONT_B}`; ctx.fillStyle='#f2ece0';

function drawWorld(){
  ctx.save();
  if(G.shake>.3) ctx.translate(rand(-1,1)*G.shake*S, rand(-1,1)*G.shake*S);
  drawRoom();
  if(G.mode==='play'){
    const p=player, q=p.state==='rag'?p.pts[PELV]:p, fl=floorZ(q.x,q.y);
    ctx.strokeStyle='rgba(255,210,63,.75)'; ctx.lineWidth=2.5*S;
    ctx.beginPath(); ctx.ellipse(sx(q.x),sy(q.y,fl),20*S,9*S,0,0,Math.PI*2); ctx.stroke();
  }
  drawShadows();
  const ents=chars.map(c=>{
    let y=(c.state==='rag'?c.pts[PELV].y:c.y)+(c.state==='surf'?24:0);
    const q=c.state==='rag'?c.pts[PELV]:c;
    for(const k of STACKS) if(q.x>k.lo.x0-4&&q.x<k.lo.x1+4&&q.y>k.lo.y0-4&&q.y<k.lo.y1+4&&q.z>=k.lo.h-3) y=Math.max(y,k.lo.y1+.5);
    return {c,y};
  });
  ents.push({f:()=>drawKit(drumKit),y:drumKit.y});
  for(const m of MONITORS) ents.push({f:()=>drawMonitor(m),y:STAGE_Y-5});
  for(const k of STACKS) ents.push({f:()=>drawStack(k),y:k.lo.y1});
  ents.push({f:drawBar,y:BAR.y0-.5});
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents){ if(e.f) e.f(); else drawChar(e.c); }
  // see yourself through the crowd
  if(G.mode==='play'){ ctx.globalAlpha=.4; drawOutline(player,'#ffd23f',0); ctx.globalAlpha=1; }
  for(const q of G.parts){ ctx.fillStyle=q.col; ctx.globalAlpha=Math.min(1,q.life/20); ctx.fillRect(sx(q.x)-1.2*S,sy(q.y,q.z)-1.2*S,2.4*S,2.4*S); }
  ctx.globalAlpha=1;
  drawLights();

  G.uiRects.length=0;
  if(G.mode==='play'){
    if(player.state==='surf') G.uiRects.push(balanceRect(player));
    if(G.wod) G.uiRects.push(G.wod.phase==='pick' ? wodPromptRect() : wodPanelRect());
  }
  if(G.mode==='play'){
    const p=player;
    if(p.state==='surf') drawBalance(p);
    else {
      const h=p.pts[HEAD], bob=Math.sin(G.frame*.15)*3;
      const x=sx(h.x), y=sy(h.y,h.z+24+bob);
      ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#0b0a0f'; ctx.lineWidth=2*S;
      ctx.beginPath(); ctx.moveTo(x-9*S,y-11*S); ctx.lineTo(x+9*S,y-11*S); ctx.lineTo(x,y); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.font=`800 ${Math.round(11*S)}px ${FONT_B}`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=3*S; ctx.strokeText('YOU',x,y-19*S); ctx.fillText('YOU',x,y-19*S);
      // someone down next to you? say how to help
      const f=G.wod?null:nearestFallen(p);
      if(f){
        const q=f.pts[PELV], fx=sx(q.x), fy=sy(q.y,floorZ(q.x,q.y)), pu=.5+.5*Math.sin(G.frame*.25);
        ctx.strokeStyle=`rgba(127,216,255,${.5+pu*.5})`; ctx.lineWidth=2.5*S;
        ctx.beginPath(); ctx.ellipse(fx,fy,(22+pu*3)*S,(10+pu)*S,0,0,Math.PI*2); ctx.stroke();
        const label=touchCapable?'HELP: HELP UP':'E: HELP UP';
        ctx.font=`800 ${Math.round(12*S)}px ${FONT_B}`;
        const tw=ctx.measureText(label).width;
        if(!blocked(fx-tw/2-6*S,fy+8*S,tw+12*S,18*S)){
          ctx.fillStyle='rgba(8,6,10,.8)'; roundRect(fx-tw/2-6*S,fy+8*S,tw+12*S,18*S,5*S); ctx.fill();
          ctx.fillStyle='#7fd8ff'; ctx.fillText(label,fx,fy+17*S);
        }
      }
    }
  }
  if(G.bubble){
    const s=BAND[1], h=s.pts[HEAD];
    const bx = s.x>W*.6 ? sx(h.x)-30*S : sx(h.x)+30*S, by=sy(h.y,h.z+34);
    ctx.font=`800 ${Math.round(14*S)}px ${FONT_B}`;
    const bw=ctx.measureText(G.bubble.text).width+20*S;
    if(!blocked(s.x>W*.6?bx-bw:bx, by-26*S, bw, 36*S)) bubble(bx, by, G.bubble.text, Math.min(1,G.bubble.life/15), s.x>W*.6);
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of G.texts){
    const a=Math.min(1,t.life/20), sc=1+Math.max(0,(t.life-t.max+8))/8*.4;
    ctx.font=`800 ${Math.round(t.size*S*sc)}px ${FONT_B}`;
    const tw=ctx.measureText(t.t).width, th=t.size*S*sc, tx=sx(t.x), ty=sy(t.y,t.z);
    if(blocked(tx-tw/2, ty-th/2, tw, th)) continue;
    ctx.globalAlpha=a; ctx.lineWidth=4*S; ctx.strokeStyle='rgba(10,8,12,.85)'; ctx.strokeText(t.t,sx(t.x),sy(t.y,t.z));
    ctx.fillStyle=t.col; ctx.fillText(t.t,sx(t.x),sy(t.y,t.z));
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function bubble(x,y,text,a,left){
  ctx.save(); ctx.globalAlpha=a;
  ctx.font=`800 ${Math.round(14*S)}px ${FONT_B}`;
  const w=ctx.measureText(text).width+20*S, h=26*S;
  const x0 = left ? x-w : x;
  ctx.fillStyle='#f2ece0';
  roundRect(x0,y-h,w,h,8*S); ctx.fill();
  ctx.beginPath();
  if(left){ ctx.moveTo(x-6*S,y-2); ctx.lineTo(x+8*S,y+10*S); ctx.lineTo(x-18*S,y-2); }
  else { ctx.moveTo(x+6*S,y-2); ctx.lineTo(x-8*S,y+10*S); ctx.lineTo(x+18*S,y-2); }
  ctx.fill();
  ctx.fillStyle='#0b0a0f'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(text,x0+10*S,y-h/2+1);
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

let vig=null, vigKey='';
function drawAtmos(){
  // smoky haze and a heavy vignette: it's a small dark room. Drawn once per window size.
  const key=CW+'x'+CH;
  if(vigKey!==key){
    vigKey=key; vig=document.createElement('canvas'); vig.width=Math.ceil(CW/2); vig.height=Math.ceil(CH/2);
    const v=vig.getContext('2d'), w=vig.width, h=vig.height;
    const g=v.createRadialGradient(w/2,h*.45,Math.min(w,h)*.22,w/2,h/2,Math.max(w,h)*.72);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.6)');
    v.fillStyle='rgba(120,90,70,.05)'; v.fillRect(0,0,w,h); v.fillStyle=g; v.fillRect(0,0,w,h);
  }
  ctx.drawImage(vig,0,0,CW,CH);
  if(G.timeScale<.9){
    // slow-mo streaks across the screen
    ctx.save(); ctx.globalAlpha=(1-G.timeScale)*.35; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    for(let i=0;i<14;i++){ const y=((i*97+G.frame*23)%CH), x=((i*211+G.frame*41)%(CW+200))-100; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+120,y); ctx.stroke(); }
    ctx.restore();
  }
  if(G.flash>.02){ ctx.fillStyle=`rgba(255,250,240,${G.flash*.5})`; ctx.fillRect(0,0,CW,CH); }
}

function arrow(x,y,r,d,col){
  // a filled direction arrow
  const a={U:-Math.PI/2,D:Math.PI/2,L:Math.PI,R:0}[d];
  ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(r,0); ctx.lineTo(-r*.2,-r*.8); ctx.lineTo(-r*.2,-r*.32); ctx.lineTo(-r*.85,-r*.32); ctx.lineTo(-r*.85,r*.32); ctx.lineTo(-r*.2,r*.32); ctx.lineTo(-r*.2,r*.8); ctx.closePath(); ctx.fill();
  ctx.restore();
}
const DIRCOL={U:'#ffd23f',L:'#ff4d5e',D:'#3fd16b',R:'#38b6ff'}, DIRKEY={U:'W',L:'A',D:'S',R:'D'};
function wodPromptRect(){ const u=hudScale(), w=Math.min(520*u,CW-24), h=230*u; return [HW-w/2, CH*.5-h/2, w, h]; }
function wodPanelRect(){ const u=hudScale(), w=Math.min(600*u,CW-24), h=118*u; return [HW-w/2, CH-h-(touchCapable?150:14)*u, w, h]; }
function drawWod(){
  const w=G.wod, u=hudScale();
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  if(w.phase==='line'){
    const [x0,y0,pw,ph]=wodPanelRect(), cx=x0+pw/2;
    ctx.fillStyle='rgba(8,6,10,.82)'; roundRect(x0,y0,pw,ph,12*u); ctx.fill();
    ctx.strokeStyle='rgba(255,210,63,.7)'; ctx.lineWidth=2*u; ctx.stroke();
    const left=G.secObj.end*4-G.beat;
    arrow(cx-(pw/2-40*u)*(w.side<0?1:-1),y0+34*u,14*u,w.side<0?'L':'R','#ffd23f');
    ctx.font=`${Math.round(26*u)}px ${FONT_D}`; ctx.fillStyle='#ffd23f';
    ctx.fillText(w.side<0?'YOU JOINED THE LEFT WALL':'YOU JOINED THE RIGHT WALL',cx,y0+34*u);
    ctx.font=`800 ${Math.round(left<=4.2?34:15)*u}px ${FONT_B}`; ctx.fillStyle='#f2ece0';
    ctx.fillText(left<=4.2 ? String(Math.max(1,Math.ceil(left))) : 'WAIT FOR THE DROP...',cx,y0+70*u);
    ctx.font=`500 ${Math.round(13*u)}px ${FONT_B}`; ctx.fillStyle='rgba(242,236,224,.75)';
    ctx.fillText(touchCapable?'Then flick the stick with the arrows, on the beat, to keep the wall going':'Then hit W A S D with the arrows, on the beat, to keep the wall going',cx,y0+100*u);
  } else if(w.phase==='pick'){
    const [x0,y0,pw,ph]=wodPromptRect(), cx=x0+pw/2;
    ctx.fillStyle='rgba(8,6,10,.78)'; roundRect(x0,y0,pw,ph,14*u); ctx.fill();
    ctx.strokeStyle='rgba(212,21,47,.7)'; ctx.lineWidth=2*u; ctx.stroke();
    ctx.font=`${Math.round(54*u)}px ${FONT_D}`; ctx.shadowColor='#d4152f'; ctx.shadowBlur=18*u; ctx.fillStyle='#ff2d44';
    ctx.fillText('WALL OF DEATH',cx,y0+48*u); ctx.shadowBlur=0;
    ctx.font=`800 ${Math.round(22*u)}px ${FONT_B}`; ctx.fillStyle='#f2ece0';
    ctx.fillText('PICK A SIDE',cx,y0+98*u);
    for(const side of [-1,1]){
      const bx=cx+side*pw*.24, by=y0+160*u, bw=pw*.38, bh=64*u;
      const chosen=w.side===side, dim=w.side && !chosen;
      ctx.globalAlpha=dim?.3:1;
      ctx.fillStyle=chosen?'rgba(255,210,63,.25)':'rgba(242,236,224,.08)'; roundRect(bx-bw/2,by-bh/2,bw,bh,10*u); ctx.fill();
      ctx.strokeStyle=chosen?'#ffd23f':'rgba(242,236,224,.35)'; ctx.lineWidth=2*u; ctx.stroke();
      arrow(bx+side*bw*.33,by,13*u,side<0?'L':'R',chosen?'#ffd23f':'#f2ece0');
      ctx.fillStyle='#f2ece0'; ctx.font=`800 ${Math.round(18*u)}px ${FONT_B}`;
      ctx.fillText(side<0?(touchCapable?'LEFT':'A   LEFT'):(touchCapable?'RIGHT':'RIGHT   D'), bx-side*bw*.08, by);
      ctx.globalAlpha=1;
    }
    if(w.phase==='pick' && touchCapable){ ctx.font=`500 ${Math.round(13*u)}px ${FONT_B}`; ctx.fillStyle='rgba(242,236,224,.7)'; ctx.fillText('flick the stick left or right',cx,y0+ph-14*u); }
  } else if(w.phase==='combo'){
    const [x0,y0,pw,ph]=wodPanelRect(), bn=judgeBeat();
    ctx.fillStyle='rgba(8,6,10,.82)'; roundRect(x0,y0,pw,ph,12*u); ctx.fill();
    ctx.strokeStyle='rgba(212,21,47,.6)'; ctx.lineWidth=2*u; ctx.stroke();
    // header: what you're doing and how long you've held
    const held=clamp((bn-w.start)*BEAT,0,20.9), frac=clamp((bn-w.start)/(w.end-w.start),0,1);
    ctx.textAlign='left'; ctx.font=`${Math.round(22*u)}px ${FONT_D}`; ctx.fillStyle='#ff2d44'; ctx.fillText('HOLD THE WALL',x0+14*u,y0+20*u);
    ctx.textAlign='right'; ctx.font=`800 ${Math.round(13*u)}px ${FONT_B}`; ctx.fillStyle='#f2ece0';
    ctx.fillText(held.toFixed(1)+' / 20s   STREAK '+w.streak,x0+pw-14*u,y0+20*u);
    if(w.notes.length && bn<w.notes[0].b-.5){ ctx.textAlign='center'; ctx.fillStyle='#ffd23f'; ctx.fillText('HIT THE ARROWS AS THEY REACH THE RING',x0+pw*.55,y0+56*u); }
    ctx.fillStyle='rgba(242,236,224,.15)'; ctx.fillRect(x0+14*u,y0+36*u,pw-28*u,5*u);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(x0+14*u,y0+36*u,(pw-28*u)*frac,5*u);
    // the lane: notes slide left into the hit ring on the beat
    const laneY=y0+80*u, hx=x0+60*u, ppb=58*u;
    ctx.strokeStyle='rgba(242,236,224,.12)'; ctx.lineWidth=2*u; ctx.beginPath(); ctx.moveTo(x0+14*u,laneY); ctx.lineTo(x0+pw-14*u,laneY); ctx.stroke();
    for(let b=Math.ceil(bn); b<bn+12; b++){ const x=hx+(b-bn)*ppb; if(x>x0+pw-16*u) break; ctx.fillStyle='rgba(242,236,224,.18)'; ctx.fillRect(x-1,laneY-14*u,2,28*u); }
    const pulse=.5+.5*Math.cos((bn%1)*Math.PI*2);
    ctx.strokeStyle=`rgba(255,210,63,${.5+pulse*.5})`; ctx.lineWidth=3*u; ctx.beginPath(); ctx.arc(hx,laneY,24*u+pulse*3*u,0,Math.PI*2); ctx.stroke();
    ctx.textAlign='center';
    for(let k=w.i;k<w.notes.length;k++){
      const n=w.notes[k], x=hx+(n.b-bn)*ppb;
      if(x>x0+pw-24*u) break;
      if(x<x0+10*u) continue;
      ctx.fillStyle='rgba(8,6,10,.9)'; roundRect(x-19*u,laneY-19*u,38*u,38*u,8*u); ctx.fill();
      ctx.strokeStyle=DIRCOL[n.d]; ctx.lineWidth=2.5*u; ctx.stroke();

      ctx.beginPath(); ctx.arc(hx,laneY,(24+age*30)*u,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1;
    }
    if(w.fbT>0){
      ctx.globalAlpha=Math.min(1,w.fbT/10); ctx.font=`800 ${Math.round(16*u)}px ${FONT_B}`;
      ctx.fillStyle=w.fb==='PERFECT'?'#ffd23f':'#9effa8'; ctx.fillText(w.fb,x0+pw*.5,y0+20*u); ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}

    const rows = touchCapable
      ? [['Stick','move (push to the edge to run)'],['JUMP','jump · off the stage or the bar it\'s a dive'],['SHOVE / KICK','hit whoever is in front'],['SPIN','hold to helicopter (too long and you get dizzy)'],['LIFT','get lifted to crowd surf, or help someone up'],['Surfing','steer left / right to keep your balance']]
      : [['WASD / arrows','move, SHIFT to run'],['SPACE','jump · off the stage or the bar it\'s a dive'],['J / L','shove / kick'],['K (hold)','helicopter spin (too long and you get dizzy)'],['E','get lifted to crowd surf, or help someone up'],['A / D surfing','keep your balance up there']];
    const y0=CH*.3+165*u;
    rows.forEach((r,i)=>{
      ctx.textAlign='right'; ctx.fillStyle='#ffd23f'; ctx.font=`800 ${Math.round(14*u)}px ${FONT_B}`; ctx.fillText(r[0],HW-12*u,y0+i*24*u);
      ctx.textAlign='left'; ctx.fillStyle='#f2ece0'; ctx.font=`500 ${Math.round(14*u)}px ${FONT_B}`; ctx.fillText(r[1],HW+12*u,y0+i*24*u);
    });
    if(G.best>0){ ctx.textAlign='center'; ctx.fillStyle='rgba(242,236,224,.6)'; ctx.font=`800 ${Math.round(12*u)}px ${FONT_B}`; ctx.fillText('BEST SET  '+G.best.toLocaleString(),HW,y0+rows.length*24*u+16*u); }
  }
  ctx.restore();
}

function drawOver(){
  const u=hudScale(), st=G.stats;
  veil(.7);
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`${Math.round(84*u)}px ${FONT_D}`;
  const tw=ctx.measureText('THANK YOU, GOODNIGHT!').width;
  if(tw>CW*.92) ctx.font=`${Math.round(84*u*CW*.92/tw)}px ${FONT_D}`;
  ctx.shadowColor='#d4152f'; ctx.shadowBlur=24*u; ctx.fillStyle='#ff2d44';
  ctx.fillText('THANK YOU, GOODNIGHT!',HW,CH*.2); ctx.shadowBlur=0;
  ctx.font=`800 ${Math.round(16*u)}px ${FONT_B}`; ctx.fillStyle='rgba(242,236,224,.7)'; ctx.fillText('HYPE',HW,CH*.2+66*u);
  ctx.font=`800 ${Math.round(56*u)}px ${FONT_B}`; ctx.fillStyle='#f2ece0'; ctx.fillText(G.score.toLocaleString(),HW,CH*.2+106*u);
  if(G.newBest){ ctx.font=`800 ${Math.round(16*u)}px ${FONT_B}`; ctx.fillStyle='#ffd23f'; ctx.fillText('NEW BEST SET!',HW,CH*.2+144*u); }
  const rows=[['People you leveled',st.leveled],['Times you got leveled',st.knocked],['People you helped up',st.helped],
    ['Airtime',st.air.toFixed(1)+' s'],['Longest crowd surf',st.longSurf.toFixed(1)+' s'],['Stage and bar dives',st.dives]];
  const y0=CH*.2+178*u;
  rows.forEach((r,i)=>{
    ctx.textAlign='right'; ctx.font=`500 ${Math.round(15*u)}px ${FONT_B}`; ctx.fillStyle='rgba(242,236,224,.8)'; ctx.fillText(r[0],HW-14*u,y0+i*26*u);
    ctx.textAlign='left'; ctx.font=`800 ${Math.round(15*u)}px ${FONT_B}`; ctx.fillStyle='#ffd23f'; ctx.fillText(String(r[1]),HW+14*u,y0+i*26*u);
  });
  ctx.textAlign='center'; ctx.font=`800 ${Math.round(18*u)}px ${FONT_B}`; ctx.fillStyle='#f2ece0';
  if((G.frame>>5)%2===0) ctx.fillText(touchCapable?'TAP FOR AN ENCORE':'PRESS ENTER FOR AN ENCORE',HW,y0+rows.length*26*u+30*u);
  ctx.restore();
}

function drawPaused(){
  const u=hudScale(); veil(.6);
  txt('PAUSED',HW,CH*.42,`${Math.round(80*u)}px ${FONT_D}`,'#ff2d44','center','middle');
  txt(touchCapable?'TAP TO KEEP MOSHING':'PRESS ESC TO KEEP MOSHING',HW,CH*.42+60*u,`800 ${Math.round(16*u)}px ${FONT_B}`,'#f2ece0','center','middle');
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0b0a0f'; ctx.fillRect(0,0,CW,CH);
  // the camera pushes in on the wall of death
  const flyingCam = G.mode==='play' && player.dive && !player.grounded && player.state==='up';
  G.zoom += ((flyingCam ? 1.4 : (G.wod && G.mode==='play') ? (G.wod.phase==='combo'?1.28:1.12) : 1) - G.zoom)*(flyingCam?.08:.04);
  S = S0*G.zoom;
  updateCamera();
  if(touchCapable){ const lb=document.getElementById('b-lift'), t=G.mode==='play'&&nearestFallen(player)?'HELP':'LIFT'; if(lb.textContent!==t) lb.textContent=t; }
  drawWorld();
  drawAtmos();
  if(G.mode==='play'||G.mode==='paused') drawHUD();
  if(G.mode==='boot') drawTitle();
  if(G.mode==='over') drawOver();
  if(G.mode==='paused') drawPaused();
}

// ============================================================
//  INPUT
// ============================================================
const touchCapable = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints>0);
const touch = {on:false, x:0, y:0, id:null, ox:0, oy:0, run:false, spin:false, armed:true};
function press(name){
  if(name==='jump') In.jumpP=true; else if(name==='shove') In.shoveP=true; else if(name==='kick') In.kickP=true; else if(name==='lift') In.liftP=true;
}
function anyStart(){
  if(G.mode==='boot'){ startGame(); return true; }
  if(G.mode==='over'){ startGame(); return true; }
  if(G.mode==='paused'){ G.mode='play'; return true; }
  return false;
}
addEventListener('keydown', e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat){ keys[e.code]=true; return; }
  if(G.mode==='boot'){ startGame(); return; }
  if(G.mode==='over'){ if(e.code==='Enter'||e.code==='Space') startGame(); return; }
  if(e.code==='Escape'||e.code==='KeyP'){ G.mode = G.mode==='paused'?'play':'paused'; return; }
  if(G.mode==='paused') return;
  keys[e.code]=true;
  const dir={KeyW:'U',ArrowUp:'U',KeyA:'L',ArrowLeft:'L',KeyS:'D',ArrowDown:'D',KeyD:'R',ArrowRight:'R'}[e.code];
  if(dir) In.dirP=dir;
  if(e.code==='Space') press('jump');
  if(e.code==='KeyJ') press('shove');
  if(e.code==='KeyL') press('kick');
  if(e.code==='KeyE') press('lift');
  if(e.code==='KeyM') toggleMute();
});
addEventListener('keyup', e=>{ keys[e.code]=false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; if(G.mode==='play') G.mode='paused'; });
cv.addEventListener('pointerdown', e=>{ if(G.mode!=='play') anyStart(); });

const zone=document.getElementById('stickzone'), stickEl=document.getElementById('stick'), knob=document.getElementById('knob');
zone.addEventListener('pointerdown', e=>{
  if(anyStart()) return;
  touch.id=e.pointerId; touch.ox=e.clientX; touch.oy=e.clientY; touch.on=true; touch.x=touch.y=0;
  stickEl.hidden=false; stickEl.style.left=e.clientX+'px'; stickEl.style.top=e.clientY+'px'; knob.style.transform='';
  zone.setPointerCapture(e.pointerId);
});
zone.addEventListener('pointermove', e=>{
  if(e.pointerId!==touch.id) return;
  let dx=e.clientX-touch.ox, dy=e.clientY-touch.oy; const d=Math.hypot(dx,dy), max=50;
  if(d>max){ dx*=max/d; dy*=max/d; }
  touch.x=dx/max; touch.y=dy/max;
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  // a flick of the stick counts as a direction press (picking a side, wall-of-death combos)
  const m=Math.hypot(touch.x,touch.y);
  if(m>.75 && touch.armed){ touch.armed=false; In.dirP = Math.abs(touch.x)>Math.abs(touch.y) ? (touch.x<0?'L':'R') : (touch.y<0?'U':'D'); }
  else if(m<.35) touch.armed=true;
});
const endStick=e=>{ if(e.pointerId!==touch.id) return; touch.on=false; touch.id=null; touch.x=touch.y=0; stickEl.hidden=true; };
zone.addEventListener('pointerup', endStick); zone.addEventListener('pointercancel', endStick);
for(const b of document.querySelectorAll('#btns button')){
  const k=b.dataset.k;
  b.addEventListener('pointerdown', e=>{
    e.preventDefault(); if(anyStart()) return;
    b.setPointerCapture(e.pointerId);
    if(k==='spin') touch.spin=true; else if(k==='run'){ touch.run=!touch.run; b.classList.toggle('on',touch.run); } else press(k);
  });
  const up=()=>{ if(k==='spin') touch.spin=false; };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
}
document.getElementById('pausebtn').addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(G.mode==='play') G.mode='paused'; else if(G.mode==='paused') G.mode='play';
});

// ============================================================
//  LOOP
// ============================================================
spawnAll(); buildPlan(); G.t0=clockNow();
let last=performance.now(), acc=0, frameMs=16, sinceQ=0;
function frame(t){
  const dt=t-last;
  // bullet time while you're in the air on a dive
  const flying = G.mode==='play' && player.dive && !player.grounded && player.state==='up';
  G.timeScale += ((flying?.32:1)-G.timeScale)*(flying?.25:.12);
  AU.slow(flying);
  acc += Math.min(100, dt)*G.timeScale; last=t;
  // running slow? draw fewer pixels
  frameMs += (Math.min(100,dt)-frameMs)*.05; sinceQ++;
  if(sinceQ>150 && frameMs>24 && Q>.55 && !document.hidden){ Q=Math.max(.5,Q-.2); sinceQ=0; resize(); }
  while(acc>=1000/60){
    if(G.mode!=='paused') step();
    else G.t0 += 1/60;   // hold the beat clock still while paused
    acc-=1000/60;
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(document.fonts && document.fonts.load){ document.fonts.load(`40px ${FONT_D}`).catch(()=>{}); document.fonts.load(`800 20px ${FONT_B}`).catch(()=>{}); }
</script>
